; S.P.E.C.T.R.E. OS - Primary Configuration File
; Board: Generic ESP32 DevKit V1
; Hardware: SX1278 (Ra-02) LoRa, 2.4" TFT Display (SPI), Push Buttons

[env:spectre_node]
platform = espressif32
board = esp32dev
framework = arduino

; Match this baud rate in your Serial.begin() for debugging
monitor_speed = 115200

; -----------------------------------------------------------------------------
; DEPENDENCIES (Automatically downloaded by PlatformIO)
; -----------------------------------------------------------------------------
lib_deps =
    ; LoRa Communication Driver
    jgromes/RadioLib @ ^6.1.0
    
    ; Hardware Interrupt & Button Debouncing
    bxparks/AceButton @ ^1.9.2
    
    ; Display Driver for 2.4" TFT
    bodmer/TFT_eSPI @ ^2.5.31

; -----------------------------------------------------------------------------
; BUILD FLAGS (Dynamic Hardware Configuration)
; -----------------------------------------------------------------------------
build_flags =
    ; 1. Tell TFT_eSPI to use these flags instead of User_Setup.h
    -D USER_SETUP_LOADED=1
    
    ; 2. Define the Driver (ILI9341 is standard for 2.4" SPI TFTs)
    -D ILI9341_DRIVER=1
    
    ; 3. Define standard ESP32 VSPI pins for the Display
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15       ; Pin 15 for Display Chip Select
    -D TFT_DC=2        ; Pin 2 for Data/Command
    -D TFT_RST=4       ; Pin 4 for Reset
    
    ; 4. Load basic fonts for UI development
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    
    ; 5. Set SPI Frequency (27 MHz is stable for breadboard wiring)
    -D SPI_FREQUENCY=27000000
    
    ; 6. Enable verbose debugging for the development phase
    -D CORE_DEBUG_LEVEL=5