; S.P.E.C.T.R.E. OS - Primary Configuration File
; Board: Generic ESP32 DevKit V1

[env:spectre_node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Increased upload speed for faster development iterations
upload_speed = 921600

; Fixes a typo in your original file ("lib_deps =n" -> "lib_deps =")
lib_deps = 
    jgromes/RadioLib @ ^6.1.0
    bxparks/AceButton @ ^1.9.2
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.0
    adafruit/Adafruit BusIO @ ^1.14.5

; Add build flags to enable hardware-accelerated mbedtls
build_flags = 
    -D MBEDTLS_GCM_C
    -D MBEDTLS_ECDH_C
    -D MBEDTLS_ECP_DP_SECP256R1_ENABLED